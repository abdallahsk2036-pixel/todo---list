<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>قائمة المهام</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px;text-align:center}
input,button{padding:10px;margin:5px;border-radius:5px;border:1px solid #ccc}
button{background:#4CAF50;color:white;cursor:pointer}
li{background:white;padding:10px;margin:5px;list-style:none;border-radius:5px;cursor:pointer}
li.done{text-decoration:line-through;color:gray}
</style>
</head>
<body>
<h1>📝 قائمة المهام</h1>
<input id="task" placeholder="اكتب مهمة جديدة">
<button onclick="addTask()">إضافة</button>
<ul id="list"></ul>

<script>
function addTask(){
  let t=document.getElementById('task').value;
  if(t==='')return;
  let li=document.createElement('li');
  li.textContent=t;
  li.onclick=function(){this.classList.toggle('done')};
  document.getElementById('list').appendChild(li);
  document.getElementById('task').value='';
}
</script>
</body>
</html>
